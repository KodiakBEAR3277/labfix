# Substituted into /etc/nginx/conf.d/default.conf by the entrypoint.
# Only ${PORT} is expanded (envsubst whitelist) so nginx's own $variables
# survive untouched.
server {
    listen ${PORT};
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 15M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
